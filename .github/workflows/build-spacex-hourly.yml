name: Build SpaceX hourly execution panel

on:
  push:
    branches:
      - data-fetch-20260926
    paths:
      - ".github/workflows/build-spacex-hourly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pandas numpy yfinance
      - name: Download 1h data and build closing-hour concentration
        shell: python
        run: |
          from pathlib import Path
          import pandas as pd, numpy as np, yfinance as yf, json
          out=Path("out"); out.mkdir(exist_ok=True)
          tickers=[
          "NVDA","AAPL","MU","MSFT","AMD","AMZN","TSLA","GOOGL","INTC","GOOG","AVGO","META",
          "AMAT","WMT","LRCX","CSCO","COST","KLAC","SNDK","NFLX","PANW","TXN","PLTR","MRVL",
          "LIN","WDC","STX","AMGN","QCOM","CRWD","ADI","PEP","ASML","TMUS","APP","GILD","ARM",
          "ISRG","SHOP","BKNG","VRTX","SBUX","FTNT","CDNS","MAR","MNST","CEG","ADP","CSX","CMCSA",
          "DDOG","MELI","SNPS","ADBE","ALAB","ORLY","DASH","TER","AEP","MDLZ","INTU","NXPI","HON",
          "HONA","ROST","CTAS","MPWR","WBD","LITE","REGN","PCAR","NBIS","ABNB","RKLB","FAST","BKR",
          "EA","PDD","XEL","FANG","MCHP","FER","EXC","TTWO","AXON","ODFL","CCEP","CRWV","KDP","IDXX",
          "ADSK","ALNY","PYPL","PAYX","ROP","TRI","GEHC","MSTR","KHC","CPRT","DXCM","WDAY","QQQ"
          ]
          failures=[]; rec=[]
          for t in tickers:
              try:
                  z=yf.download(t,start="2026-06-01",end="2026-07-15",
                                interval="1h",auto_adjust=False,progress=False,threads=False)
                  if isinstance(z.columns,pd.MultiIndex): z.columns=z.columns.get_level_values(0)
                  if z.empty:
                      failures.append([t,"empty"]); continue
                  z=z.reset_index()
                  dtcol="Datetime" if "Datetime" in z.columns else z.columns[0]
                  z["dt"]=pd.to_datetime(z[dtcol])
                  # Yahoo timestamps carry exchange tz; convert to New York when possible.
                  try: z["dt_ny"]=z["dt"].dt.tz_convert("America/New_York")
                  except: z["dt_ny"]=z["dt"]
                  z["date"]=z["dt_ny"].dt.date.astype(str)
                  z["hour"]=z["dt_ny"].dt.hour
                  # Regular-session hourly bars are typically 09:30/10:30...15:30.
                  # Define last bar per date rather than hard-code timestamp.
                  day=z.groupby("date").agg(day_volume=("Volume","sum"),
                                             n_bars=("Volume","size")).reset_index()
                  last=(z.sort_values("dt_ny").groupby("date").tail(1)
                          [["date","Volume","Close","dt_ny"]]
                          .rename(columns={"Volume":"last_hour_volume","Close":"last_close",
                                           "dt_ny":"last_bar_time"}))
                  x=day.merge(last,on="date")
                  x["last_hour_share"]=x["last_hour_volume"]/x["day_volume"]
                  normal=x[(x["date"]>="2026-06-01")&(x["date"]<="2026-06-25")]
                  event=x[x["date"]=="2026-07-06"]
                  if event.empty:
                      failures.append([t,"no_jul6"]); continue
                  e=event.iloc[0]
                  rec.append({
                    "ticker":t,
                    "jul6_last_hour_share":float(e["last_hour_share"]),
                    "jul6_last_hour_volume":float(e["last_hour_volume"]),
                    "jul6_day_volume":float(e["day_volume"]),
                    "normal_last_hour_share_mean":float(normal["last_hour_share"].mean()),
                    "normal_last_hour_share_median":float(normal["last_hour_share"].median()),
                    "normal_last_hour_share_sd":float(normal["last_hour_share"].std(ddof=1)),
                    "jul6_last_hour_share_ratio":float(e["last_hour_share"]/normal["last_hour_share"].mean()),
                    "jul6_last_hour_share_z":float((e["last_hour_share"]-normal["last_hour_share"].mean())/normal["last_hour_share"].std(ddof=1)),
                    "normal_days":int(len(normal)),
                    "jul6_last_bar_time":str(e["last_bar_time"]),
                  })
              except Exception as e:
                  failures.append([t,str(e)])
          pd.DataFrame(rec).to_csv(out/"spacex_hourly_execution_panel.csv",index=False)
          (out/"audit.json").write_text(json.dumps({
              "requested":len(tickers),"successful":len(rec),"failures":failures,
              "normal_window":["2026-06-01","2026-06-25"],
              "event_date":"2026-07-06",
              "definition":"last regular-session hourly bar share of daily volume"
          },indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: spacex-hourly-20260926
          path: out/
          retention-days: 30
          if-no-files-found: error
