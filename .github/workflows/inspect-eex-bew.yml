name: Inspect EEX BEW public data endpoint

on:
  push:
    branches:
      - data-fetch-20260926
    paths:
      - ".github/workflows/inspect-eex-bew.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page and referenced scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL="https://www.eex.com/de/customised-solutions/bew"
          curl -L -sS --retry 3 --retry-all-errors -A "Mozilla/5.0" "$URL" -o out/bew.html
          echo "$URL" > out/source_url.txt
          grep -Eoi 'https?://[^"<> ]+|src="[^"]+|href="[^"]+' out/bew.html > out/links.txt || true
          grep -Ein 'FEUA|EUA Futures|custom|api|json|ajax|datasource|histor|download|chart|table' out/bew.html > out/relevant_lines.txt || true
          wc -c out/bew.html
          head -30 out/relevant_lines.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: eex-bew-inspection-20260926
          path: out/
          retention-days: 30
