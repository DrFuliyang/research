name: Build SpaceX funding-side market panel

on:
  push:
    branches:
      - data-fetch-20260926
    paths:
      - ".github/workflows/build-spacex-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: python -m pip install --quiet pandas numpy scipy statsmodels yfinance

      - name: Build panel
        shell: python
        run: |
          from pathlib import Path
          import pandas as pd, numpy as np, json, hashlib
          import yfinance as yf

          out = Path("out")
          out.mkdir(exist_ok=True)

          tickers = [
          "NVDA","AAPL","MU","MSFT","AMD","AMZN","TSLA","GOOGL","INTC","GOOG","AVGO","META",
          "AMAT","WMT","LRCX","CSCO","COST","KLAC","SNDK","NFLX","PANW","TXN","PLTR","MRVL",
          "LIN","WDC","STX","AMGN","QCOM","CRWD","ADI","PEP","ASML","TMUS","APP","GILD","ARM",
          "ISRG","SHOP","BKNG","VRTX","SBUX","FTNT","CDNS","MAR","MNST","CEG","ADP","CSX","CMCSA",
          "DDOG","MELI","SNPS","ADBE","ALAB","ORLY","DASH","TER","AEP","MDLZ","INTU","NXPI","HON",
          "HONA","ROST","CTAS","MPWR","WBD","LITE","REGN","PCAR","NBIS","ABNB","RKLB","FAST","BKR",
          "EA","PDD","XEL","FANG","MCHP","FER","EXC","TTWO","AXON","ODFL","CCEP","CRWV","KDP","IDXX",
          "ADSK","ALNY","PYPL","PAYX","ROP","TRI","GEHC","MSTR","KHC","CPRT","DXCM","WDAY",
          "QQQ","SPY"
          ]
          # Yahoo aliases where needed.
          aliases = {"FER":"FER.MC"}
          request = [aliases.get(t,t) for t in tickers]

          data = yf.download(
              request,
              start="2025-07-01",
              end="2026-07-18",
              auto_adjust=False,
              group_by="ticker",
              threads=True,
              progress=False,
          )

          records=[]
          failures=[]
          def series_for(req, field):
              try:
                  if len(request)==1:
                      return data[field]
                  return data[(req,field)]
              except Exception:
                  return pd.Series(dtype=float)

          for t,req in zip(tickers,request):
              close=series_for(req,"Close").dropna()
              vol=series_for(req,"Volume").dropna()
              if close.empty:
                  failures.append(t); continue
              z=pd.DataFrame({"close":close,"volume":vol}).dropna(subset=["close"])
              z.index=pd.to_datetime(z.index).tz_localize(None)
              z["dollar_volume"]=z["close"]*z["volume"]
              adv1=z.loc["2026-06-01":"2026-06-25","dollar_volume"].mean()
              adv2=z.loc["2026-06-01":"2026-06-19","dollar_volume"].mean()
              avgv1=z.loc["2026-06-01":"2026-06-25","volume"].mean()

              def c(d):
                  try:return float(z.loc[pd.Timestamp(d),"close"])
                  except:return np.nan
              def v(d):
                  try:return float(z.loc[pd.Timestamp(d),"volume"])
                  except:return np.nan

              c2,c6,c7,c8,c9,c10,c13 = [c(d) for d in
                  ["2026-07-02","2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10","2026-07-13"]]
              records.append({
                  "ticker":t,"request_ticker":req,
                  "adv_usd_jun1_25":adv1,"adv_usd_jun1_19":adv2,
                  "avg_daily_shares_jun1_25":avgv1,
                  "close_jul2":c2,"close_jul6":c6,"close_jul7":c7,
                  "close_jul8":c8,"close_jul9":c9,"close_jul10":c10,"close_jul13":c13,
                  "volume_jul6":v("2026-07-06"),"volume_jul7":v("2026-07-07"),
                  "ret_jul6":c6/c2-1 if np.isfinite(c2*c6) else np.nan,
                  "ret_jul7":c7/c6-1 if np.isfinite(c6*c7) else np.nan,
                  "car_jul6_7":c7/c2-1 if np.isfinite(c2*c7) else np.nan,
                  "car_jul6_13":c13/c2-1 if np.isfinite(c2*c13) else np.nan,
                  "reversal_jul8_13":c13/c7-1 if np.isfinite(c7*c13) else np.nan,
              })

          panel=pd.DataFrame(records)
          panel.to_csv(out/"spacex_market_panel.csv",index=False)
          Path(out/"spacex_market_panel_audit.json").write_text(json.dumps({
              "requested_tickers":len(tickers),
              "successful_tickers":len(panel),
              "failures":failures,
              "date_range":["2025-07-01","2026-07-17"],
              "primary_ADV_window":["2026-06-01","2026-06-25"],
              "robust_ADV_window":["2026-06-01","2026-06-19"]
          },indent=2),encoding="utf-8")
          print(panel.head())
          print("FAILURES",failures)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacex-market-panel-20260926
          path: out/
          if-no-files-found: error
          retention-days: 30
